name: iOS Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project targets and schemes
        run: |
          xcodebuild \
            -list \
            -project "LiveContainer.xcodeproj"

      - name: Build unsigned archive
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath "$PWD/build/LiveContainer.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      - name: Inspect archive
        run: |
          echo "Applications in archive:"
          find "build/LiveContainer.xcarchive/Products/Applications" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print

      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="build/LiveContainer.xcarchive/Products/Applications/FlekDeck.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::FlekDeck.app was not found"
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/FlekDeck.app

          cd build
          zip -qry "FlekDeck-unsigned.ipa" Payload
          rm -rf Payload

          echo "Created IPA:"
          ls -lh FlekDeck-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned
          path: build/FlekDeck-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-xcarchive
          path: build/LiveContainer.xcarchive
          if-no-files-found: error
          retention-days: 7
