name: Build FlekDeck IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FlekDeck
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -list \
            -project "LiveContainer.xcodeproj"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer"

      - name: Clean
        run: |
          xcodebuild clean \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release

      - name: Build archive
        run: |
          set -o pipefail

          mkdir -p build

          xcodebuild archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Verify application
        run: |
          echo "Archive contents:"
          find build/FlekDeck.xcarchive/Products/Applications \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print

          test -d \
            "build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app"

      - name: Create IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R \
            "build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app" \
            "build/Payload/"

          cd build

          zip -qry \
            "FlekDeck-unsigned.ipa" \
            "Payload"

          rm -rf Payload

          echo "IPA created:"
          ls -lh FlekDeck-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned
          path: build/FlekDeck-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-xcarchive
          path: build/FlekDeck.xcarchive
          if-no-files-found: error
          retention-days: 7
